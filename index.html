<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grist widgets</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f6f3;
      --card: #ffffff;
      --border: #e3e1dc;
      --text: #2e2b27;
      --muted: #8a867e;
      --accent: #2f7d4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; }
    .note { color: var(--muted); font-size: 13px; margin: 0 0 28px; }
    .cards { display: grid; gap: 14px; }
    .card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      text-decoration: none;
      color: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    a.card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .card-title { font-size: 15px; font-weight: 600; }
    .badge {
      font-size: 11px; font-weight: 500;
      padding: 2px 8px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .badge-live { background: #e3f2e9; color: var(--accent); }
    .badge-planned { background: #efede9; color: var(--muted); }
    .card-desc { font-size: 13px; color: var(--muted); margin: 0; }
    .card.planned { opacity: .6; cursor: default; }
    .card.planned .card-title { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Grist widgets</h1>
    <p class="note">All widgets are served from this repo via GitHub Pages.</p>
    <div class="cards">
      <a class="card" href="groups.html">
        <div class="card-head">
          <span class="card-title">groups.html</span>
          <span class="badge badge-live">live</span>
        </div>
        <p class="card-desc">Grouped view — collapsible record groups with sums, selection and editing</p>
      </a>
      <a class="card planned" href="salary.html">
        <div class="card-head">
          <span class="card-title">salary.html</span>
          <span class="badge badge-planned">planned</span>
        </div>
        <p class="card-desc">Teacher salary counter — monthly grouped classes + linked expenses</p>
      </a>
    </div>
  </div>
</body>
</html>
