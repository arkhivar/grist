<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher salary counter — planned Grist widget</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f6f3;
      --card: #ffffff;
      --border: #e3e1dc;
      --text: #2e2b27;
      --muted: #8a867e;
      --accent: #2f7d4f;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    main {
      width: min(560px, 100%);
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .05);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 10px; font-size: 26px; line-height: 1.2; }
    p { margin: 0; color: var(--muted); }
    a {
      display: inline-block;
      margin-top: 24px;
      color: var(--accent);
      font-weight: 500;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Planned Grist widget</p>
    <h1>Teacher salary counter</h1>
    <p>This widget is being designed for monthly grouped classes and linked salary expenses. It is not ready to add to a Grist document yet.</p>
    <a href="./">Back to the widget gallery</a>
  </main>
</body>
</html>
